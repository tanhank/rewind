name: Validate Release

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "packaging/**"
      - ".github/workflows/**"
      - "debian/**"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 --ignore RUSTSEC-2026-0543

  linux:
    name: Linux build, test, and CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: CLI smoke test
        run: |
          set -euo pipefail
          ./target/release/rewind --version
          ./target/release/rewind --help
          ./target/release/rewind status --json
          ./target/release/rewind completions bash > /dev/null
          ./target/release/rewind completions zsh > /dev/null
          ./target/release/rewind completions fish > /dev/null

  musl:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: validate-${{ matrix.target }}
      - name: Build binary with cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Verify binary exists
        run: |
          test -f "target/${{ matrix.target }}/release/rewind"

  debian:
    name: Debian package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y binutils dpkg
      - name: Build static debian package
        run: |
          set -euo pipefail
          mkdir -p dist/deb
          ./packaging/build-static-deb.sh target/release/rewind amd64 dist/deb
      - name: Verify package structure
        run: |
          set -euo pipefail
          deb_file=$(find dist/deb -name '*.deb' | head -1)
          test -n "$deb_file"
          echo "Inspecting $deb_file"
          ar -t "$deb_file"
          dpkg-deb -I "$deb_file"
          dpkg-deb -c "$deb_file"

  fedora-rpm:
    name: Fedora RPM spec check
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm tools
        run: dnf install -y rpm-build rpmlint
      - name: Lint RPM spec
        run: |
          rpmlint packaging/rewind.spec || true
          rpmbuild --nobuild packaging/rewind.spec

  macos:
    name: macOS build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: validate-${{ matrix.os }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: CLI smoke test
        run: |
          set -euo pipefail
          ./target/release/rewind --version
          ./target/release/rewind --help
          ./target/release/rewind status --json
