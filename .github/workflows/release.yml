name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: validate release tag and source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Determine target tag
        id: tag
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.tag || github.ref_name }}"
          if [[ -z "$raw_tag" ]]; then
            echo "::error::No release tag specified"
            exit 1
          fi
          echo "tag=$raw_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Validate tag and version consistency
        id: validate
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "Validating tag format: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Tag '$tag' does not follow semver format 'vX.Y.Z'"
            exit 1
          fi

          version="${tag#v}"
          echo "Validating Cargo.toml version matches tag version $version..."
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag version ($version)"
            exit 1
          fi

          echo "Validating git tag existence in repository refs..."
          tag_sha=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" 2>/dev/null || git rev-parse -q --verify "refs/tags/${tag}" 2>/dev/null || true)
          if [[ -z "$tag_sha" ]]; then
            echo "::error::Tag '${tag}' does not exist in repository refs"
            exit 1
          fi

          current_head=$(git rev-parse HEAD)
          echo "Target tag: $tag"
          echo "Resolved commit SHA: $current_head"
          echo "Tag ref SHA: $tag_sha"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$current_head" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-15
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary with cross
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build binary natively
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          name="rewind-${version}-${{ matrix.target }}"
          archive="rewind-${{ matrix.target }}.tar.gz"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/rewind" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          mkdir -p "dist/${name}/shell"
          cp shell/bash.sh shell/zsh.sh shell/fish.fish "dist/${name}/shell/"
          tar -C dist -czf "dist/${archive}" "${name}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rewind-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: rewind ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true

  apt:
    name: publish APT repository
    needs: [prepare, release]
    permissions:
      contents: write
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
